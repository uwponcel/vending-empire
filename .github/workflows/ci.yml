name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Installed from the pinned upstream release rather than a third-party
      # setup action, so the toolchain bootstrap has no dependency we do not own.
      - name: Install Rokit
        run: |
          curl -fsSL -o rokit.zip \
            https://github.com/rojo-rbx/rokit/releases/download/v1.2.0/rokit-1.2.0-linux-x86_64.zip
          unzip -q rokit.zip
          ./rokit self-install
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install pinned tools
        run: rokit install --no-trust-check

      # AGENTS.md is generated from CLAUDE.md. Fail rather than let them drift.
      # pwsh is preinstalled on GitHub's ubuntu runners.
      - name: Check agent docs are in sync
        shell: pwsh
        run: ./scripts/sync-agent-docs.ps1 -Check

      - name: Check formatting
        run: stylua --check src/ tests/

      - name: Lint
        run: selene src/

      # Roblox definitions, sourcemap, and Lune typedefs. None are committed, all are
      # reproducible from the versions pinned in rokit.toml.
      - name: Generate type-check artifacts
        shell: pwsh
        run: ./scripts/lsp-setup.ps1

      # The gate that makes `--!strict` mean something. selene is a linter and does not
      # type-check, so without this the strict annotations are decorative.
      - name: Type check
        shell: pwsh
        run: ./scripts/analyze.ps1

      - name: Unit tests
        run: lune run tests/run

      # Proves the project still compiles to a place file. Rojo will not create
      # the parent directory itself.
      - name: Build place
        run: |
          mkdir -p build
          rojo build --output build/vending-empire.rbxl

      - name: Upload place artifact
        uses: actions/upload-artifact@v4
        with:
          name: vending-empire-rbxl
          path: build/vending-empire.rbxl
          retention-days: 14
